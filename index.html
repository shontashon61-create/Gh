    <div id="hint">ЛЕВАЯ ПОЛОВИНА — джойстик &middot; ПРАВАЯ — обзор<br>ПК: WASD + мышь, Esc — пауза</div>

</div>
<script>
'use strict';
/* =====================================================================
   ЭХО КУБОВ — 3D-лабиринт на рейкастинге.
   Один файл, ноль библиотек, ноль внешних ассетов:
   текстуры, звук и лабиринт генерируются кодом прямо в браузере.
   ===================================================================== */

// ------------------------- настройки -------------------------
const TEX = 64, TES = TEX * TEX;     // текстура стены 64x64
const SPR = 32, SPES = SPR * SPR;    // текстура спрайта 32x32
const SHADES = 20;                   // уровней освещённости
const PLANE = 0.68;                  // тангенс половины угла обзора по горизонтали

const DIFF = {
  easy: { cells: 10, enemies: 3, spd: 0.95, shards: 5, dmg: 13, name: 'ЛЕГКО' },
  norm: { cells: 12, enemies: 5, spd: 1.18, shards: 7, dmg: 18, name: 'НОРМА' },
  hard: { cells: 14, enemies: 8, spd: 1.50, shards: 9, dmg: 24, name: 'ХАРД'  }
};

// ------------------------- утилиты -------------------------
const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
const clamp255 = v => (v < 0 ? 0 : (v > 255 ? 255 : v));
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function hash2(x, y, s) {
  let h = (x | 0) * 374761393 + (y | 0) * 668265263 + (s | 0) * 2246822519;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

// ------------------------- генерация текстур -------------------------
function newCv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function grain(c, amt) {
  const x = c.getContext('2d');
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const n = (Math.random() * 2 - 1) * amt;
    p[i] = clamp255(p[i] + n); p[i + 1] = clamp255(p[i + 1] + n); p[i + 2] = clamp255(p[i + 2] + n);
  }
  x.putImageData(d, 0, 0);
}

// превращаем картинку в SHADES уровней яркости: в рендере остаётся только индексация
function toShades(c, opaque) {
  const x = c.getContext('2d');
  const d = x.getImageData(0, 0, c.width, c.height);
  const src = new Uint32Array(d.data.buffer.slice(0));
  const out = [];
  for (let s = 0; s < SHADES; s++) {
    const f = 0.12 + (s / (SHADES - 1)) * 1.02;
    const o = new Uint32Array(src.length);
    for (let i = 0; i < src.length; i++) {
      const p = src[i];
      const a = (p >>> 24) & 255;
      const r = Math.min(255, (p & 255) * f) | 0;
      const g = Math.min(255, ((p >>> 8) & 255) * f) | 0;
      const b = Math.min(255, ((p >>> 16) & 255) * f) | 0;
      let A = opaque ? 255 : (a * clamp(f, 0.05, 1.05)) | 0;
      if (A > 255) A = 255;
      o[i] = ((A << 24) >>> 0) | (b << 16) | (g << 8) | r;
    }
    out.push(o);
  }
  return out;
}

function texStone() {
  const c = newCv(TEX, TEX), x = c.getContext('2d');
  x.fillStyle = '#4d545f'; x.fillRect(0, 0, TEX, TEX);
  for (let row = 0; row < 4; row++) {
    for (let col = -1; col < 3; col++) {
      const bx = col * 32 + (row % 2 ? 16 : 0), by = row * 16;
      const sh = hash2(col + 4, row, 11);
      x.fillStyle = 'rgb(' + ((92 + sh * 22) | 0) + ',' + ((99 + sh * 22) | 0) + ',' + ((110 + sh * 24) | 0) + ')';
      x.fillRect(bx + 1, by + 1, 30, 14);
      x.fillStyle = 'rgba(255,255,255,.07)'; x.fillRect(bx + 1, by + 1, 30, 2);
      x.fillStyle = 'rgba(0,0,0,.22)'; x.fillRect(bx + 1, by + 13, 30, 2);
    }
  }
  grain(c, 24); return c;
}
function texMoss() {
  const c = newCv(TEX, TEX), x = c.getContext('2d');
  x.fillStyle = '#3f4f45'; x.fillRect(0, 0, TEX, TEX);
  for (let i = 0; i < 240; i++) {
    const px = Math.random() * TEX, py = Math.random() * TEX, r = 2 + Math.random() * 6;
    x.fillStyle = 'rgba(' + ((40 + Math.random() * 40) | 0) + ',' + ((95 + Math.random() * 70) | 0) + ',' + ((45 + Math.random() * 40) | 0) + ',.65)';
    x.beginPath(); x.arc(px, py, r, 0, 6.284); x.fill();
  }
  x.fillStyle = 'rgba(0,0,0,.25)';
  x.fillRect(0, 0, TEX, 3); x.fillRect(0, TEX - 3, TEX, 3);
  grain(c, 18); return c;
}
function texMetal() {
  const c = newCv(TEX, TEX), x = c.getContext('2d');
  x.fillStyle = '#3a444f'; x.fillRect(0, 0, TEX, TEX);
  for (let i = 0; i < 8; i++) {
    x.fillStyle = i % 2 ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.16)';
    x.fillRect(0, i * 8, TEX, 4);
  }
  for (let gy = 0; gy < 4; gy++) for (let gx = 0; gx < 4; gx++) {
    const cx = 8 + gx * 16, cy = 8 + gy * 16;
    x.fillStyle = '#5b6673'; x.beginPath(); x.arc(cx, cy, 2.4, 0, 6.284); x.fill();
    x.fillStyle = 'rgba(255,255,255,.25)'; x.beginPath(); x.arc(cx - .7, cy - .7, 1, 0, 6.284); x.fill();
  }
  grain(c, 15); return c;
}
function texWood() {
  const c = newCv(TEX, TEX), x = c.getContext('2d');
  x.fillStyle = '#6b4526'; x.fillRect(0, 0, TEX, TEX);
  for (let i = 0; i < 4; i++) {
    const bx = i * 16;
    x.fillStyle = 'rgb(' + (120 + i * 8) + ',' + (78 + i * 6) + ',' + (40 + i * 4) + ')';
    x.fillRect(bx + 1, 0, 14, TEX);
    x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(bx, 0, 2, TEX);
    x.strokeStyle = 'rgba(60,35,15,.45)'; x.lineWidth = 1;
    for (let k = 0; k < 10; k++) {
      const yy = Math.random() * TEX;
      x.beginPath(); x.moveTo(bx + 2, yy); x.lineTo(bx + 13, yy + (Math.random() * 6 - 3)); x.stroke();
    }
  }
  x.fillStyle = 'rgba(0,0,0,.4)';
  x.fillRect(0, 21, TEX, 2); x.fillRect(0, 43, TEX, 2);
  grain(c, 14); return c;
}
function texVoid() {
  const c = newCv(TEX, TEX), x = c.getContext('2d');
  x.fillStyle = '#101018'; x.fillRect(0, 0, TEX, TEX);
  for (let i = 0; i < 90; i++) {
    x.fillStyle = 'rgba(' + ((110 + Math.random() * 90) | 0) + ',' + ((40 + Math.random() * 70) | 0) + ',' + ((180 + Math.random() * 70) | 0) + ',' + (0.15 + Math.random() * 0.5).toFixed(2) + ')';
    const s = 1 + Math.random() * 2.5;
    x.fillRect(Math.random() * TEX, Math.random() * TEX, s, s);
  }
  x.strokeStyle = 'rgba(180,110,255,.35)'; x.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    let px = Math.random() * TEX, py = Math.random() * TEX;
    x.beginPath(); x.moveTo(px, py);
    for (let k = 0; k < 5; k++) { px += Math.random() * 18 - 9; py += Math.random() * 18 - 9; x.lineTo(px, py); }
    x.stroke();
  }
  grain(c, 10); return c;
}
function texTech() {
  const c = newCv(TEX, TEX), x = c.getContext('2d');
  x.fillStyle = '#10222e'; x.fillRect(0, 0, TEX, TEX);
  x.fillStyle = 'rgba(63,227,255,.10)'; x.fillRect(0, 0, TEX, TEX);
  x.strokeStyle = 'rgba(63,227,255,.55)'; x.lineWidth = 2;
  x.strokeRect(3, 3, TEX - 6, TEX - 6);
  x.strokeStyle = 'rgba(63,227,255,.28)'; x.lineWidth = 1;
  x.strokeRect(9, 9, TEX - 18, TEX - 18);
  x.fillStyle = 'rgba(63,227,255,.8)';
  for (let i = 0; i < 4; i++) x.fillRect(14 + i * 12, TEX / 2 - 1, 6, 2);
  grain(c, 9); return c;
}

function sprShard() {
  const c = newCv(SPR, SPR), x = c.getContext('2d');
  const g = x.createRadialGradient(16, 14, 1, 16, 16, 15);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(.35, 'rgba(120,245,255,1)');
  g.addColorStop(1, 'rgba(0,150,220,0)');
  x.fillStyle = g;
  x.beginPath(); x.moveTo(16, 1); x.lineTo(29, 16); x.lineTo(16, 31); x.lineTo(3, 16); x.closePath(); x.fill();
  x.strokeStyle = 'rgba(220,255,255,.95)'; x.lineWidth = 1.5;
  x.beginPath(); x.moveTo(16, 3); x.lineTo(27, 16); x.lineTo(16, 29); x.lineTo(5, 16); x.closePath(); x.stroke();
  return c;
}
function sprEnemy() {
  const c = newCv(SPR, SPR), x = c.getContext('2d');
  const g = x.createRadialGradient(16, 17, 2, 16, 16, 14);
  g.addColorStop(0, '#3a0b1c'); g.addColorStop(.7, '#170309'); g.addColorStop(1, 'rgba(10,0,6,0)');
  x.fillStyle = g;
  x.beginPath(); x.ellipse(16, 17, 13, 14, 0, 0, 6.284); x.fill();
  x.shadowColor = '#ff2b4d'; x.shadowBlur = 6;
  x.fillStyle = '#ff5a6e';
  x.beginPath(); x.ellipse(11, 14, 2.6, 2.0, -0.3, 0, 6.284); x.fill();
  x.beginPath(); x.ellipse(21, 14, 2.6, 2.0, 0.3, 0, 6.284); x.fill();
  x.shadowBlur = 0;
  x.fillStyle = 'rgba(255,255,255,.9)';
  x.beginPath(); x.arc(10.4, 13.4, .8, 0, 6.284); x.fill();
  x.beginPath(); x.arc(20.4, 13.4, .8, 0, 6.284); x.fill();
  return c;
}
function sprPortal() {
  const c = newCv(SPR, SPR), x = c.getContext('2d');
  x.shadowColor = 'rgba(255,79,216,.9)'; x.shadowBlur = 10;
  for (let i = 0; i < 3; i++) {
    x.strokeStyle = 'rgba(' + (255 - i * 40) + ',' + (79 + i * 55) + ',' + (216 + i * 10) + ',.9)';
    x.lineWidth = 2.5 - i * .5;
    x.beginPath(); x.ellipse(16, 16, 13 - i * 3.5, 14 - i * 3.5, 0, 0, 6.284); x.stroke();
  }
  const g = x.createRadialGradient(16, 16, 1, 16, 16, 8);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(.6, 'rgba(255,140,240,.9)');
  g.addColorStop(1, 'rgba(160,40,220,0)');
  x.fillStyle = g; x.beginPath(); x.arc(16, 16, 8, 0, 6.284); x.fill();
  return c;
}

const WALLTEX = [], SPRTEX = [];
[texStone, texMoss, texMetal, texWood, texVoid, texTech].forEach(f => WALLTEX.push(toShades(f(), true)));
[sprShard, sprEnemy, sprPortal].forEach(f => SPRTEX.push(toShades(f(), false)));

// ------------------------- лабиринт -------------------------
let GW = 0, map = null;

function genMap(cells) {
  GW = cells * 2 + 1;
  map = new Uint8Array(GW * GW).fill(1);
  const at = (x, y) => y * GW + x;
  const seen = new Uint8Array(cells * cells);
  const sidx = (x, y) => y * cells + x;
  const stack = [[0, 0]];
  seen[0] = 1; map[at(1, 1)] = 0;

  while (stack.length) {
    const cur = stack[stack.length - 1], cx = cur[0], cy = cur[1], nb = [];
    if (cx > 0 && !seen[sidx(cx - 1, cy)]) nb.push([-1, 0]);
    if (cx < cells - 1 && !seen[sidx(cx + 1, cy)]) nb.push([1, 0]);
    if (cy > 0 && !seen[sidx(cx, cy - 1)]) nb.push([0, -1]);
    if (cy < cells - 1 && !seen[sidx(cx, cy + 1)]) nb.push([0, 1]);
    if (!nb.length) { stack.pop(); continue; }
    const d = nb[(Math.random() * nb.length) | 0];
    const nx = cx + d[0], ny = cy + d[1];
    seen[sidx(nx, ny)] = 1;
    map[at(cx * 2 + 1 + d[0], cy * 2 + 1 + d[1])] = 0;
    map[at(nx * 2 + 1, ny * 2 + 1)] = 0;
    stack.push([nx, ny]);
  }
  // немного петель: чистый лабиринт-«дерево» слишком предсказуем
  for (let y = 1; y < GW - 1; y++) for (let x = 1; x < GW - 1; x++) {
    if (map[at(x, y)] === 0) continue;
    const l = map[at(x - 1, y)] === 0, r = map[at(x + 1, y)] === 0;
    const u = map[at(x, y - 1)] === 0, dn = map[at(x, y + 1)] === 0;
    if (((l && r) || (u && dn)) && Math.random() < 0.16) map[at(x, y)] = 0;
  }
  // типы стен блоками 4x4 + техно-контур по периметру
  for (let y = 0; y < GW; y++) for (let x = 0; x < GW; x++) {
    if (map[at(x, y)] === 0) continue;
    let t;
    const h = hash2(Math.floor(x / 4), Math.floor(y / 4), 7);
    t = h < .30 ? 1 : h < .50 ? 2 : h < .68 ? 3 : h < .84 ? 4 : 5;
    if (x === 0 || y === 0 || x === GW - 1 || y === GW - 1) t = 6;
    map[at(x, y)] = t;
  }
}
function isWall(x, y) {
  const mx = x | 0, my = y | 0;
  if (mx < 0 || my < 0 || mx >= GW || my >= GW) return true;
  return map[my * GW + mx] > 0;
}
const blocked = (x, y, r) => isWall(x - r, y - r) || isWall(x + r, y - r) || isWall(x - r, y + r) || isWall(x + r, y + r);
function freeCells() {
  const a = [];
  for (let y = 1; y < GW - 1; y++) for (let x = 1; x < GW - 1; x++)
    if (map[y * GW + x] === 0) a.push([x + .5, y + .5]);
  return a;
}

// ------------------------- звук (синтез на месте) -------------------------
let AC = null, master = null, drone = null, droneG = null;
const sfx = {
  init() {
    if (AC) return;
    try {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return;
      AC = new Ctor();
      master = AC.createGain(); master.gain.value = 0.30; master.connect(AC.destination);
      drone = AC.createOscillator(); drone.type = 'sawtooth'; drone.frequency.value = 48;
      droneG = AC.createGain(); droneG.gain.value = 0.0001;
      drone.connect(droneG); droneG.connect(master); drone.start();
    } catch (e) { AC = null; }
  },
  resume() { if (AC && AC.state === 'suspended') AC.resume(); },
  blip(f1, f2, dur, type, vol, delay) {
    if (!AC) return;
    const t = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.4, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
  },
  pick() { this.blip(700, 1500, 0.16, 'triangle', 0.5); this.blip(1400, 2100, 0.12, 'sine', 0.25, 0.06); },
  hurt() { this.blip(240, 70, 0.32, 'sawtooth', 0.5); },
  open() { this.blip(180, 520, 0.5, 'triangle', 0.35); },
  portal() { this.blip(90, 40, 0.9, 'sawtooth', 0.45); this.blip(300, 900, 0.7, 'triangle', 0.3, 0.1); },
  win() {[523, 659, 784, 1046].forEach((f, i) => this.blip(f, f * 1.01, 0.22, 'triangle', 0.42, i * 0.13)); },
  setDanger(v) {
    if (!droneG) return;
    droneG.gain.value = 0.0001 + v * 0.075;
    drone.frequency.value = 46 + v * 68;
  }
};

const ctx = cvs.getContext('2d', { alpha: false });
const mini = document.getElementById('mini');
const miniCtx = mini.getContext('2d');
const joyEl = document.getElementById('joy');
const knobEl = document.getElementById('joyKnob');
const zonesEl = document.getElementById('zones');
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const flashEl = document.getElementById('flash');

const hpfillEl = document.getElementById('hpfill');
const shardTxEl = document.getElementById('shardTxt');
const timeEl = document.getElementById('timeHud');
const arrowEl = document.getElementById('arrow');
const distEl = document.getElementById('distTxt');
const ovEl = document.getElementById('overlay');

let RW = 320, RH = 240, img = null, buf32 = null, zbuf = null, quality = 1;

function setRes(q) {
  quality = clamp(q, 0.55, 1);
  const st = document.getElementById('stage');
  const W = Math.max(140, st.clientWidth - 8), H = Math.max(110, st.clientHeight - 8);
  const ar = 4 / 3;
  let w = W, h = w / ar;
  if (h > H) { h = H; w = h * ar; }
  cvs.style.width = w + 'px'; cvs.style.height = h + 'px';
  RW = clamp(Math.round(w / 1.6 * quality), 120, 480);
  RH = Math.max(110, Math.round(RW * (h / w)));
  cvs.width = RW; cvs.height = RH;
  ctx.imageSmoothingEnabled = false;
  img = ctx.createImageData(RW, RH);
  buf32 = new Uint32Array(img.data.buffer);
  zbuf = new Float32Array(RW);
}

const PL = { x: 1.5, y: 1.5, a: 0.5, pitch: 0 };

// градиенты неба/пола: считаем один раз
const CEILG = [], FLOORG = [];
const packRGB = (r, g, b) => ((0xff000000 | (b << 16) | (g << 8) | r) >>> 0);
for (let i = 0; i < 64; i++) {
  const t = i / 63;
  CEILG.push(packRGB((8 + t * 10) | 0, (10 + t * 14) | 0, (20 + t * 20) | 0));
  FLOORG.push(packRGB((32 - t * 25) | 0, (27 - t * 21) | 0, (36 - t * 27) | 0));
}

function touchStart(e) {
  if (G.mode !== 'play') return;
  if (e.target && e.target.closest && e.target.closest('button')) return;
  for (let i = 0; i < e.changedTouches.length; i++) {

      }
    } else if (IN.lid < 0) {
      IN.lid = t.identifier; IN.lx = t.clientX; IN.ly = t.clientY;
    }
  }
  e.preventDefault();
}
function touchMove(e) {
  if (G.mode !== 'play') return;
  for (let i = 0; i < e.changedTouches.length; i++) {

// ------------------------- рендер -------------------------
function drawCeilFloor(hz) {
  for (let y = 0; y < RH; y++) {
    const s = y * RW;
    if (y < hz) {
      const t = clamp((y / Math.max(1, hz)) * 63, 0, 63) | 0;
      buf32.fill(CEILG[t], s, s + RW);
    } else {
      const t = clamp(((y - hz) / Math.max(1, RH - hz)) * 63, 0, 63) | 0;
      buf32.fill(FLOORG[t], s, s + RW);
    }
  }
}

function drawSprites(dirX, dirY, planeX, planeY, hz) {
  const list = [];
  for (let i = 0; i < G.sprites.length; i++) {
    const s = G.sprites[i];
    if (!s.alive) continue;
    const dx = s.x - PL.x, dy = s.y - PL.y;
    list.push([dx * dx + dy * dy, s]);
  }
  list.sort((a, b) => b[0] - a[0]);
  const inv = 1 / (planeX * dirY - dirX * planeY);

  for (let i = 0; i < list.length; i++) {
    const s = list[i][1];
    const sx = s.x - PL.x, sy = s.y - PL.y;
    const tx = inv * (dirY * sx - dirX * sy);
    const ty = inv * (-planeY * sx + planeX * sy);
    if (ty < 0.28) continue;

    const scrX = Math.round((RW / 2) * (1 + tx / ty));
    const scale = s.type === 2 ? 1.3 : (s.type === 0 ? 0.42 : 0.92);
    const size = Math.abs(RH / ty) * scale;
    const bob = (s.type === 0 ? Math.sin(s.phase) * 0.16 : 0) * RH / ty;
    const cyy = hz - bob;
    const y0 = Math.round(cyy - size / 2), y1 = Math.round(cyy + size / 2);
    const x0 = Math.round(scrX - size / 2), x1 = Math.round(scrX + size / 2);
    const hgt = y1 - y0, wid = x1 - x0;
    if (hgt <= 0 || wid <= 0) continue;

    const dd = Math.sqrt(list[i][0]);
    let lv = (SHADES - 1) - Math.min(SHADES - 1, (dd * 1.5) | 0);
    if (s.type === 0) lv += 6;         // осколки светятся сквозь тьму
    if (s.type === 2) lv = SHADES - 1; // портал виден всегда
    lv = clamp(lv, 0, SHADES - 1) | 0;
    const tex = SPRTEX[s.type][lv];

    const yy0 = Math.max(0, y0), yy1 = Math.min(RH - 1, y1);
    const xx0 = Math.max(0, x0), xx1 = Math.min(RW - 1, x1);
    for (let x = xx0; x <= xx1; x++) {
      if (zbuf[x] < ty) continue;
      const texX = (((x - x0) * SPR) / wid) | 0;
      if (texX < 0 || texX >= SPR) continue;
      let p = yy0 * RW + x;
      for (let y = yy0; y <= yy1; y++, p += RW) {
        const texY = (((y - y0) * SPR) / hgt) | 0;
        if (texY < 0 || texY >= SPR) continue;
        const c = tex[texY * SPR + texX];
        if ((c >>> 24) < 24) continue;
        buf32[p] = c;
      }
    }
  }
}

function render() {
  const dirX = Math.cos(PL.a), dirY = Math.sin(PL.a);
  const planeX = -dirY * PLANE, planeY = dirX * PLANE;
  const shake = G.shake > 0.4 ? (Math.random() - 0.5) * G.shake : 0;
  const hz = (RH >> 1) + (PL.pitch | 0) + (G.bob | 0) + (shake | 0);

  drawCeilFloor(hz);

  for (let x = 0; x < RW; x++) {
    const cam = 2 * x / RW - 1;
    const rdx = dirX + planeX * cam, rdy = dirY + planeY * cam;
    let mx = PL.x | 0, my = PL.y | 0;
    const ddx = Math.abs(1 / (rdx || 1e-9)), ddy = Math.abs(1 / (rdy || 1e-9));
    let stepX, stepY, sdx, sdy;
    if (rdx < 0) { stepX = -1; sdx = (PL.x - mx) * ddx; } else { stepX = 1; sdx = (mx + 1 - PL.x) * ddx; }
    if (rdy < 0) { stepY = -1; sdy = (PL.y - my) * ddy; } else { stepY = 1; sdy = (my + 1 - PL.y) * ddy; }

    let side = 0, tile = 0, guard = 0;
    while (guard++ < 400) {
      if (sdx < sdy) { sdx += ddx; mx += stepX; side = 0; }
      else { sdy += ddy; my += stepY; side = 1; }
      if (mx < 0 || my < 0 || mx >= GW || my >= GW) { tile = 0; break; }
      tile = map[my * GW + mx];
      if (tile > 0) break;
    }
    let d = side === 0 ? (mx - PL.x + (1 - stepX) / 2) / rdx : (my - PL.y + (1 - stepY) / 2) / rdy;
    if (!(d > 0.0001)) d = 0.0001;
    zbuf[x] = d;
    if (tile <= 0) continue;

    const lineH = RH / d;
    const py0 = hz - lineH / 2, py1 = hz + lineH / 2;
    let wallX = side === 0 ? PL.y + d * rdy : PL.x + d * rdx;
    wallX -= Math.floor(wallX);
    let texX = (wallX * TEX) | 0;
    if ((side === 0 && rdx > 0) || (side === 1 && rdy < 0)) texX = TEX - texX - 1;
    if (texX < 0) texX = 0;
    if (texX >= TEX) texX = TEX - 1;

    let lv = (SHADES - 1) - Math.min(SHADES - 1, (d * 1.55) | 0);
    if (side === 1) lv -= 2;
    lv = clamp(lv, 0, SHADES - 1) | 0;
    const tex = WALLTEX[tile - 1][lv];

    const y0 = Math.max(0, Math.round(py0)), y1 = Math.min(RH - 1, Math.round(py1));
    const step = TEX / lineH;
    let tp = (y0 - py0) * step;
    let p = y0 * RW + x;
    for (let y = y0; y <= y1; y++, p += RW) {
      const ty = (tp | 0) & 63;
      tp += step;
      buf32[p] = tex[ty * TEX + texX];
    }
  }

  drawSprites(dirX, dirY, planeX, planeY, hz);
  ctx.putImageData(img, 0, 0);
}

// ------------------------- миникарта -------------------------
function drawMini() {
  const S = 132, R = 6, cs = S / (R * 2 + 1);
  const x = miniCtx;
  x.fillStyle = 'rgba(6,10,16,.92)'; x.fillRect(0, 0, S, S);
  const ca = Math.cos(-PL.a - Math.PI / 2), sa = Math.sin(-PL.a - Math.PI / 2);
  const bxx = PL.x | 0, byy = PL.y | 0;

  for (let ty = -R; ty <= R; ty++) for (let tx = -R; tx <= R; tx++) {
    const wx = bxx + tx, wy = byy + ty;
    if (wx < 0 || wy < 0 || wx >= GW || wy >= GW) continue;
    const rx = wx + .5 - PL.x, ry = wy + .5 - PL.y;
    const sx = rx * ca - ry * sa, sy = rx * sa + ry * ca;
    const px = (sx + R + .5) * cs, py = (sy + R + .5) * cs;
    x.fillStyle = map[wy * GW + wx] > 0 ? 'rgba(74,100,126,.8)' : 'rgba(16,26,38,.9)';
    x.fillRect(px - cs / 2, py - cs / 2, cs + .7, cs + .7);
  }

  for (let i = 0; i < G.sprites.length; i++) {
    const s = G.sprites[i];
    if (!s.alive) continue;
    if (s.type === 1 && dist(s.x, s.y, PL.x, PL.y) > 6.5) continue;
    const rx = s.x - PL.x, ry = s.y - PL.y;
    const sx = rx * ca - ry * sa, sy = rx * sa + ry * ca;
    if (Math.abs(sx) > R || Math.abs(sy) > R) continue;
    const px = (sx + R + .5) * cs, py = (sy + R + .5) * cs;
    const pulse = 1 + Math.sin(G.t * 6 + s.phase) * 0.35;
    x.fillStyle = s.type === 0 ? '#3fe3ff' : (s.type === 2 ? '#ff4fd8' : '#ff4260');
    x.beginPath(); x.arc(px, py, (s.type === 1 ? 2.7 : 2.2) * pulse, 0, 6.284); x.fill();
  }

  const cx = S / 2, cy = S / 2;
  x.fillStyle = '#ffffff';
  x.beginPath(); x.moveTo(cx, cy - 5.5); x.lineTo(cx - 4.2, cy + 4.5); x.lineTo(cx + 4.2, cy + 4.5); x.closePath(); x.fill();
  x.strokeStyle = 'rgba(63,227,255,.9)'; x.lineWidth = 1; x.strokeRect(.5, .5, S - 1, S - 1);
}

// ------------------------- состояние игры -------------------------
const G = {
  mode: 'menu', diff: 'norm', cfg: DIFF.norm,
  t: 0, hp: 100, invuln: 0, got: 0, total: 0,
  sprites: [], portal: null, portalOpen: false,
  bob: 0, walk: 0, shake: 0, msgT: 0
};

function moveEnt(E, dx, dy, r) {
  if (!blocked(E.x + dx, E.y, r)) E.x += dx;
  if (!blocked(E.x, E.y + dy, r)) E.y += dy;
}
function losFree(ax, ay, bx, by) {
  const d = Math.hypot(bx - ax, by - ay), n = Math.max(2, Math.ceil(d / 0.25));
  for (let i = 1; i < n; i++) {
    const t = i / n;
    if (isWall(ax + (bx - ax) * t, ay + (by - ay) * t)) return false;
  }
  return true;
}
function showMsg(txt, dur) {
  msgEl.textContent = txt;
  msgEl.style.opacity = '1';
  G.msgT = dur || 1.4;
}
function flash(col, a, dur) {
  flashEl.style.transition = 'none';
  flashEl.style.background = col;
  flashEl.style.opacity = String(a);
  requestAnimationFrame(function () {
    flashEl.style.transition = 'opacity ' + (dur || 0.5) + 's ease-out';
    flashEl.style.opacity = '0';
  });
}
const bestKey = () => 'echoCubes.best.' + G.diff;
function bestTime() {
  let v = 0;
  try { v = parseFloat(localStorage.getItem(bestKey()) || '0') || 0; } catch (e) { v = 0; }
  return v > 0 ? v : 0;
}
function saveBest(t) {
  try { if (!bestTime() || t < bestTime()) localStorage.setItem(bestKey(), String(t)); } catch (e) {}
}

// ------------------------- старт партии -------------------------
function startGame(d) {
  G.diff = d; G.cfg = DIFF[d];
  genMap(G.cfg.cells);
  PL.x = 1.5; PL.y = 1.5; PL.pitch = 0;
  PL.a = isWall(2.5, 1.5) ? Math.PI / 2 : 0;
  G.t = 0; G.hp = 100; G.invuln = 1.2; G.got = 0;
  G.portalOpen = false; G.portal = null; G.sprites = [];
  G.shake = 0; G.bob = 0; G.walk = 0;

  const cells = freeCells();
  const far = cells.filter(c => dist(c[0], c[1], 1.5, 1.5) > 6);
  const pool = far.length > 20 ? far : cells;

  const chosen = [];
  let guard = 0;
  while (chosen.length < G.cfg.shards && guard++ < 9000) {
    const c = pool[(Math.random() * pool.length) | 0];
    let ok = true;
    for (let i = 0; i < chosen.length; i++) {
      if (dist(chosen[i][0], chosen[i][1], c[0], c[1]) < 5) { ok = false; break; }
    }
    if (ok) chosen.push(c);
  }
  G.total = chosen.length;
  for (let i = 0; i < chosen.length; i++) {
    G.sprites.push({ x: chosen[i][0], y: chosen[i][1], type: 0, alive: true, phase: Math.random() * 6.28 });
  }

  let en = 0, g2 = 0;
  while (en < G.cfg.enemies && g2++ < 8000) {
    const c = cells[(Math.random() * cells.length) | 0];
    if (dist(c[0], c[1], 1.5, 1.5) < 9) continue;
    let ok = true;
    for (let i = 0; i < G.sprites.length; i++) {
      const s = G.sprites[i];
      if (s.type === 0 && dist(s.x, s.y, c[0], c[1]) < 2.5) { ok = false; break; }
      if (s.type === 1 && dist(s.x, s.y, c[0], c[1]) < 3.5) { ok = false; break; }
    }
    if (!ok) continue;
    G.sprites.push({
      x: c[0], y: c[1], type: 1, alive: true,
      spd: G.cfg.spd * (0.9 + Math.random() * 0.3),
      wd: Math.random() * 6.28, wt: 0, phase: Math.random() * 6.28
    });
    en++;
  }

  IN.jid = -1; IN.lid = -1; IN.mx = IN.my = 0; joyEl.style.display = 'none';
  if (IS_TOUCH) {
    zonesEl.classList.add('on');
    setTimeout(function () { zonesEl.classList.remove('on'); }, 4500);
  }
  sfx.init(); sfx.resume(); sfx.open();
  setMode('play');
  showMsg('НАЙДИ ' + G.total + ' ОСКОЛКОВ ЭХА', 2.4);
}

function openPortal() {
  const cells = freeCells();
  let bx = cells[0][0], by = cells[0][1], bd = -1;
  for (let i = 0; i < cells.length; i++) {
    const d = dist(cells[i][0], cells[i][1], PL.x, PL.y);
    if (d > bd) { bd = d; bx = cells[i][0]; by = cells[i][1]; }
  }
  G.portal = { x: bx, y: by, type: 2, alive: true, phase: 0 };
  G.sprites.push(G.portal);
  G.portalOpen = true;
  sfx.portal();
  flash('#ff4fd8', 0.42, 0.9);
  showMsg('ПОРТАЛ ОТКРЫТ — БЕГИ К НЕМУ!', 3.2);
}

// ------------------------- логика кадра -------------------------
function update(dt) {
  G.t += dt;
  if (G.invuln > 0) G.invuln -= dt;
  if (G.msgT > 0) { G.msgT -= dt; if (G.msgT <= 0) msgEl.style.opacity = '0'; }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 24);

  // ---- движение игрока ----
  let mf = 0, ms = 0;
  if (IN.jid >= 0) { mf = -IN.my; ms = IN.mx; }
  const K = IN.keys;
  if (K.KeyW || K.ArrowUp) mf += 1;
  if (K.KeyS || K.ArrowDown) mf -= 1;
  if (K.KeyD) ms += 1;
  if (K.KeyA) ms -= 1;
  if (K.ArrowLeft || K.KeyQ) PL.a -= 2.1 * dt;
  if (K.ArrowRight || K.KeyE) PL.a += 2.1 * dt;

  const ml = Math.hypot(mf, ms);
  if (ml > 1) { mf /= ml; ms /= ml; }
  const moving = ml > 0.08;
  const dirX = Math.cos(PL.a), dirY = Math.sin(PL.a);
  if (moving) {
    const sp = 2.4 * dt;
    moveEnt(PL, (dirX * mf - dirY * ms) * sp, (dirY * mf + dirX * ms) * sp, 0.24);
    G.walk += dt * 9 * Math.min(1, ml);
    G.bob = Math.sin(G.walk) * 2.4;
  } else {
    G.bob *= 0.9;
  }

  // ---- тени ----
  let nearest = 99;
  for (let i = 0; i < G.sprites.length; i++) {
    const s = G.sprites[i];
    if (s.type !== 1 || !s.alive) continue;
    const dx = PL.x - s.x, dy = PL.y - s.y, d = Math.hypot(dx, dy) || 1e-6;
    if (d < nearest) nearest = d;

    let vx, vy;
    if (d < 8.5 && losFree(s.x, s.y, PL.x, PL.y)) {
      vx = dx / d; vy = dy / d;
    } else {
      s.wt -= dt;
      if (s.wt <= 0) { s.wt = 1.1 + Math.random() * 1.7; s.wd = Math.random() * 6.283; }
      vx = Math.cos(s.wd); vy = Math.sin(s.wd);
    }
    const v = s.spd * (1 + G.got * 0.05) * dt;
    const ox = s.x, oy = s.y;
    moveEnt(s, vx * v, vy * v, 0.3);
    if (Math.abs(s.x - ox) < 1e-5 && Math.abs(s.y - oy) < 1e-5) { s.wd = Math.random() * 6.283; s.wt = 0.35; }
    s.phase += dt * 2;

    if (d < 0.62 && G.invuln <= 0) {
      G.hp -= G.cfg.dmg;
      G.invuln = 1.15;
      G.shake = 12;
      flash('#ff2b4d', 0.5, 0.55);
      sfx.hurt();
      moveEnt(s, (s.x - PL.x) * 0.6, (s.y - PL.y) * 0.6, 0.3);
      if (G.hp <= 0) { G.hp = 0; sfx.setDanger(0); setMode('dead'); return; }
    }
  }
  sfx.setDanger(nearest < 9 ? clamp(1 - nearest / 9, 0, 1) : 0);

  // ---- осколки ----
  for (let i = 0; i < G.sprites.length; i++) {
    const s = G.sprites[i];
    if (s.type !== 0 || !s.alive) continue;
    s.phase += dt * 2.2;
    if (dist(s.x, s.y, PL.x, PL.y) < 0.6) {
      s.alive = false; G.got++;
      sfx.pick();
      flash('#9ff6ff', 0.22, 0.45);
      showMsg('ОСКОЛОК ' + G.got + '/' + G.total, 1);
      if (G.got >= G.total) openPortal();
    }
  }

  // ---- портал ----
  if (G.portalOpen && G.portal) {
    G.portal.phase += dt * 3;
    if (dist(G.portal.x, G.portal.y, PL.x, PL.y) < 0.95) {
      sfx.setDanger(0);
      sfx.win();
      flash('#ffffff', 0.7, 1.1);
      saveBest(G.t);
      setMode('win');
    }
  }
}

// ------------------------- HUD -------------------------
let hudAcc = 0, miniAcc = 0;
function hudTick(dt) {
  hpfillEl.style.width = clamp(G.hp, 0, 100) + '%';
  if (G.hp <= 35) hpfillEl.classList.add('low'); else hpfillEl.classList.remove('low');

  miniAcc += dt;
  if (miniAcc > 0.05) { miniAcc = 0; if (map) drawMini(); }

  hudAcc += dt;
  if (hudAcc < 0.1) return;
  hudAcc = 0;
  shardTxEl.textContent = G.got + '/' + G.total;
  timeEl.textContent = fmtTime(G.t);

  let tx = null, ty = null, bd = 1e9;
  for (let i = 0; i < G.sprites.length; i++) {
    const s = G.sprites[i];
    if (!s.alive) continue;
    if (s.type === 0 || (s.type === 2 && G.portalOpen)) {
      const d = dist(s.x, s.y, PL.x, PL.y);
      if (d < bd) { bd = d; tx = s.x; ty = s.y; }
    }
  }
  if (tx === null) { arrowEl.style.transform = 'rotate(0deg)'; distEl.textContent = '—'; return; }
  let rel = Math.atan2(ty - PL.y, tx - PL.x) - PL.a;
  while (rel > Math.PI) rel -= 2 * Math.PI;
  while (rel < -Math.PI) rel += 2 * Math.PI;
  arrowEl.style.transform = 'rotate(' + (rel * 180 / Math.PI).toFixed(1) + 'deg)';
  distEl.textContent = bd.toFixed(0) + ' м';
}

// ------------------------- экраны -------------------------
function diffRow(sel) {
  const list = ['easy', 'norm', 'hard'];
  let h = '<div class="row">';
  for (let i = 0; i < list.length; i++) {
    h += '<button class="diff' + (list[i] === sel ? ' sel' : '') + '" data-d="' + list[i] + '">' + DIFF[list[i]].name + '</button>';
  }
  return h + '</div>';
}
function bestLine() {
  const b = bestTime();
  return b ? 'Лучшее время (' + DIFF[G.diff].name + '): ' + fmtTime(b) : '';
}
function setMode(m) {
  G.mode = m;
  if (m === 'play') {
    ovEl.classList.remove('on');
    ovEl.innerHTML = '';
    return;
  }
  ovEl.classList.add('on');
  if (m === 'menu') {
    genMap(G.cfg.cells);
    PL.x = 1.5; PL.y = 1.5; PL.pitch = 0;
    PL.a = isWall(2.5, 1.5) ? Math.PI / 2 : 0;
    G.hp = 100; G.t = 0; G.got = 0; G.total = 0; G.sprites = []; G.portalOpen = false;
    if (IS_TOUCH) zonesEl.classList.add('on');
    ovEl.innerHTML =
      '<div class="card">' +
        '<div class="title">ЭХО КУБОВ</div>' +
        '<div class="sub">3D-лабиринт, написанный с нуля: рейкастинг, процедурная генерация,<br>синтез звука на месте — ни одного внешнего файла.</div>' +
        '<div class="sub">Собери все осколки эха, открой портал и выберись.<br>Тени слышат тебя сквозь темноту.</div>' +
        diffRow(G.diff) +
        '<div class="big">' + bestLine() + '</div>' +
        '<button class="go" id="goBtn">НАЧАТЬ</button>' +
        '<div class="hintRow">Телефон: левая половина — джойстик, правая — поворот камеры.<br>' +
        'ПК: <span class="kbd">WASD</span> + мышь, <span class="kbd">Esc</span> — пауза.' +
        (('ontouchstart' in window || navigator.maxTouchPoints > 0) ? '<br>iPhone: открой файл в Safari, затем «Поделиться» → «На экран Домой» — игра запустится на весь экран, без интернета.' : '') + '</div>' +
      '</div>';
  } else if (m === 'pause') {
    ovEl.innerHTML =
      '<div class="card">' +
        '<div class="title">ПАУЗА</div>' +
        '<div class="sub">Осколков: ' + G.got + '/' + G.total + ' &middot; Время: ' + fmtTime(G.t) + '</div>' +
        '<div class="row">' +
          '<button class="go" id="resBtn">ПРОДОЛЖИТЬ</button>' +
          '<button class="diff" id="againBtn">ЗАНОВО</button>' +
          '<button class="diff" id="menuBtn">В МЕНЮ</button>' +
        '</div>' +
      '</div>';
  } else if (m === 'win') {
    ovEl.innerHTML =
      '<div class="card">' +
        '<div class="title">ТЫ ВЫБРАЛСЯ</div>' +
        '<div class="big">' + fmtTime(G.t) + '</div>' +
        '<div class="sub">Сложность: ' + DIFF[G.diff].name + ' &middot; Осколков: ' + G.got + '/' + G.total + '<br>' + bestLine() + '</div>' +
        '<div class="row"><button class="go" id="againBtn">ЕЩЁ РАЗ</button><button class="diff" id="menuBtn">В МЕНЮ</button></div>' +
      '</div>';
  } else if (m === 'dead') {
    ovEl.innerHTML =
      '<div class="card">' +
        '<div class="title">ТЬМА ПОГЛОТИЛА ТЕБЯ</div>' +
        '<div class="sub">Ты продержался ' + fmtTime(G.t) + ' и собрал ' + G.got + '/' + G.total + ' осколков эха.</div>' +
        '<div class="row"><button class="go" id="againBtn">ПОПРОБОВАТЬ СНОВА</button><button class="diff" id="menuBtn">В МЕНЮ</button></div>' +
      '</div>';
  }
}

ovEl.addEventListener('click', function (e) {
  const t = e.target;
  if (!t || !t.id && !(t.dataset && t.dataset.d)) return;
  if (t.id === 'goBtn' || t.id === 'againBtn') { startGame(G.diff); return; }
  if (t.id === 'resBtn') { sfx.resume(); setMode('play'); return; }
  if (t.id === 'menuBtn') { setMode('menu'); return; }
  if (t.dataset && t.dataset.d) { G.diff = t.dataset.d; G.cfg = DIFF[G.diff]; setMode('menu'); }
});
document.getElementById('pauseBtn').addEventListener('click', function () {
  if (G.mode === 'play') setMode('pause');
  else if (G.mode === 'pause') setMode('play');
});
document.addEventListener('visibilitychange', function () {
  if (document.hidden && G.mode === 'play') setMode('pause');
});

// ------------------------- цикл -------------------------
let last = 0, qAcc = 0, qN = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (dt > 0.06) dt = 0.06;
  if (dt < 0) dt = 0;

  if (G.mode === 'play') update(dt);
  else if (G.mode === 'menu') { PL.a += dt * 0.16; PL.pitch *= 0.96; }

  if (map) render();
  hudTick(dt);

  qAcc += dt; qN++;
  if (qN >= 30) {
    const avg = qAcc / qN;
    qAcc = 0; qN = 0;
    // ниже ~37 к/с — снижаем разрешение, выше ~57 к/с — возвращаем
    if (avg > 0.027 && quality > 0.52) setRes(quality - 0.12);
    else if (avg < 0.0175 && quality < 0.99) setRes(quality + 0.12);
  }
}

// ------------------------- запуск -------------------------
function boot() {
  G.cfg = DIFF[G.diff];
  genMap(G.cfg.cells);
  setRes(1);
  setMode('menu');
  window.addEventListener('resize', function () { setRes(quality); });
  window.addEventListener('orientationchange', function () { setTimeout(function () { setRes(quality); }, 300); });
  const wake = function () { sfx.init(); sfx.resume(); };
  document.addEventListener('touchstart', wake, { passive: true });
  document.addEventListener('mousedown', wake, { passive: true });
  requestAnimationFrame(frame);
}
boot();

// Офлайн-кэш: если игра открыта по http/https (GitHub Pages), она запустится
// с домашнего экрана даже без интернета. На file:// этот блок просто пропускается.
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  });
}
</script>
