<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Super Plumber</title>
<style>
  body { margin: 0; overflow: hidden; background: #5c94fc; font-family: -apple-system, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: absolute; top: 15px; left: 20px; color: white; font-size: 22px; font-weight: 800; text-shadow: 2px 2px 0 #000; pointer-events: none; }
  .controls { position: absolute; bottom: 25px; width: 100%; display: flex; justify-content: space-between; padding: 0 25px; box-sizing: border-box; pointer-events: none; }
  .dpad, .action { display: flex; gap: 15px; pointer-events: auto; }
  .btn { width: 65px; height: 65px; background: rgba(255,255,255,0.35); border: 3px solid rgba(255,255,255,0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; text-shadow: 1px 1px 2px black; active: background: rgba(255,255,255,0.6); }
  .btn:active { background: rgba(255,255,255,0.7); transform: scale(0.95); }
</style>
</head>
<body>
<div id="ui">Монеты: <span id="score">0</span></div>
<canvas id="game"></canvas>
<div class="controls">
  <div class="dpad">
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
  </div>
  <div class="action">
    <div class="btn" id="jump">▲</div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});

// Управление
const keys = { left: false, right: false, jump: false };
function bindBtn(id, key) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
  el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
}
bindBtn('left', 'left');
bindBtn('right', 'right');
bindBtn('jump', 'jump');

// Игровые переменные
const gravity = 0.65;
let score = 0;
let cameraX = 0;

// Игрок (рисуется кодом без чужих ассетов)
const player = { x: 100, y: 100, w: 32, h: 42, vx: 0, vy: 0, speed: 5, jumpPower: -13.5, grounded: false, facing: 1 };

// Генерация мира
let platforms = [];
let coins = [];
let enemies = [];

function initLevel() {
  platforms = []; coins = []; enemies = [];
  score = 0; scoreEl.innerText = score;
  player.x = 100; player.y = 100; player.vx = 0; player.vy = 0;

  let curX = 0;
  for (let i = 0; i < 40; i++) {
    let groundW = 250 + Math.random() * 300;
    platforms.push({ x: curX, y: height - 60, w: groundW, h: 100, type: 'ground' });
    
    // Блоки и монетки в воздухе
    if (i > 0 && Math.random() > 0.3) {
      let platX = curX + 50 + Math.random() * (groundW - 150);
      let platY = height - 170 - Math.random() * 60;
      platforms.push({ x: platX, y: platY, w: 90, h: 25, type: 'brick' });
      coins.push({ x: platX + 35, y: platY - 35, r: 12, collected: false });
    }
    
    // Враги (грибочки)
    if (i > 0 && Math.random() > 0.4) {
      enemies.push({ x: curX + 120, y: height - 92, w: 32, h: 32, vx: -1.8, alive: true, minX: curX, maxX: curX + groundW - 32 });
    }
    
    // Ямы
    curX += groundW + (Math.random() > 0.3 ? 80 + Math.random() * 50 : 0);
  }
}

initLevel();

function update() {
  // Движение игрока
  if (keys.left) { player.vx = -player.speed; player.facing = -1; }
  else if (keys.right) { player.vx = player.speed; player.facing = 1; }
  else { player.vx *= 0.8; }

  if (keys.jump && player.grounded) {
    player.vy = player.jumpPower;
    player.grounded = false;
  }

  player.vy += gravity;
  player.x += player.vx;

  // Горизонтальные коллизии
  platforms.forEach(p => {
    if (player.x < p.x + p.w && player.x + player.w > p.x && player.y < p.y + p.h && player.y + player.h > p.y) {
      if (player.vx > 0) player.x = p.x - player.w;
      if (player.vx < 0) player.x = p.x + p.w;
    }
  });

  player.y += player.vy;
  player.grounded = false;

  // Вертикальные коллизии
  platforms.forEach(p => {
    if (player.x < p.x + p.w && player.x + player.w > p.x && player.y < p.y + p.h && player.y + player.h > p.y) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.grounded = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  });

  // Сбор монет
  coins.forEach(c => {
    if (!c.collected) {
      let dx = (player.x + player.w / 2) - c.x;
      let dy = (player.y + player.h / 2) - c.y;
      if (Math.hypot(dx, dy) < c.r + 20) {
        c.collected = true;
        score += 10;
        scoreEl.innerText = score;
      }
    }
  });

  // Логика врагов
  enemies.forEach(e => {
    if (!e.alive) return;
    e.x += e.vx;
    if (e.x <= e.minX || e.x >= e.maxX) e.vx *= -1;

    // Столкновение с игроком
    if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
      if (player.vy > 0 && player.y + player.h - player.vy <= e.y + 12) {
        e.alive = false;
        player.vy = -9; // Отскок от врага
        score += 20;
        scoreEl.innerText = score;
      } else {
        initLevel(); // Смерть и перезапуск
      }
    }
  });

  // Падение в пропасть
  if (player.y > height + 100) initLevel();

  // Камера следит за игроком
  cameraX = player.x - width / 3;
  if (cameraX < 0) cameraX = 0;
}

function draw() {
  ctx.clearRect(0, 0, width, height);
  ctx.save();
  ctx.translate(-cameraX, 0);

  // Отрисовка платформ
  platforms.forEach(p => {
    if (p.type === 'ground') {
      ctx.fillStyle = '#c84c0c';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#00a800';
      ctx.fillRect(p.x, p.y, p.w, 12);
    } else {
      ctx.fillStyle = '#b85c38';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x, p.y, p.w, p.h);
    }
  });

  // Отрисовка монет
  coins.forEach(c => {
    if (!c.collected) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd700';
      ctx.fill();
      ctx.strokeStyle = '#b8860b';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  });

  // Отрисовка врагов
  enemies.forEach(e => {
    if (e.alive) {
      ctx.fillStyle = '#8b4513';
      ctx.beginPath();
      ctx.arc(e.x + e.w/2, e.y + e.h/2, e.w/2, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(e.x + 4, e.y + e.h/2, e.w - 8, e.h/2);
      ctx.fillStyle = 'white';
      ctx.fillRect(e.x + 6, e.y + 8, 5, 8);
      ctx.fillRect(e.x + e.w - 11, e.y + 8, 5, 8);
    }
  });

  // Отрисовка нашего героя (красная шапка, синий комбинезон)
  ctx.fillStyle = '#e52521'; // Рубашка и кепка
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.fillStyle = '#fbd000'; // Лицо
  ctx.fillRect(player.facing === 1 ? player.x + 12 : player.x, player.y + 8, 20, 12);
  ctx.fillStyle = '#000'; // Глаз и усы
  ctx.fillRect(player.facing === 1 ? player.x + 24 : player.x + 4, player.y + 10, 4, 4);
  ctx.fillRect(player.facing === 1 ? player.x + 20 : player.x + 2, player.y + 16, 10, 3);
  ctx.fillStyle = '#0051ba'; // Комбинезон
  ctx.fillRect(player.x + 2, player.y + 24, player.w - 4, 18);

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
